    <script>
      // Apply a remembered dark theme before the first paint on signed-in pages (the landing page stays light).
      try {
        if (localStorage.getItem("socratic.theme") === "dark" && /^\/(student|teacher)(\/|$)/.test(location.pathname)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
